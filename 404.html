<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Хуудас олдсонгүй — Ээлж</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Oswald;src:url('/assets/fonts/oswald/oswald-cyrillic-wght-normal.woff2') format('woff2');font-weight:200 700;font-display:swap}
    @font-face{font-family:Roboto;src:url('/assets/fonts/roboto/roboto-cyrillic-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
    :root{color-scheme:dark}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0B0E11;color:#F2F4F4;font-family:Roboto,system-ui,sans-serif;text-align:center}
    main{max-width:420px}
    .code{font:600 14px/1 ui-monospace,monospace;letter-spacing:.12em;color:#5FD8C8;margin:0 0 16px}
    h1{font:700 40px/1.1 Oswald,sans-serif;margin:0 0 12px}
    p{color:#A3A9A9;line-height:1.6;margin:0 0 28px}
    a{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:10px;background:#05AD98;color:#04201C;font-weight:500;text-decoration:none}
    a:hover{background:#0BC0A9}
    a:focus-visible{outline:2px solid #5FD8C8;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Хуудас олдсонгүй</h1>
    <p>Таны хайсан хуудас байхгүй эсвэл зөөгдсөн байна.</p>
    <a href="/">Нүүр хуудас руу</a>
  </main>
</body>
</html>
