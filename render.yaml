# Render blueprint: https://render.com/docs/blueprint-spec
# Static site: Render runs the build and serves dist/ from its CDN. Free, no sleep.
services:
  - type: web
    name: eelj-mn
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache
